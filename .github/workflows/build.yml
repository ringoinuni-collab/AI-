

name: Build and Test Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          python -m pip install pyinstaller pywebview

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name VolumeAuto main.py

      - name: Check executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/VolumeAuto/VolumeAuto.exe")) {
            throw "EXE file was not created"
          }
          Write-Host "EXE file created successfully"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: VolumeAuto-Debug
          path: dist/VolumeAuto/
          if-no-files-found: error
